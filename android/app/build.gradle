plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {

    namespace = "com.example.flutter_provider_data"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
        // jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.example.flutter_provider_data"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36 // atau 34 (aman dan umum dipakai)
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"  // arm64-v8a penting untuk Cortex-A78/A55
        }
    }

 
    buildTypes {
        release {
            signingConfig signingConfigs.debug // atau debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    namespace = "com.example.flutter_provider_data"

}

flutter {
    source = "../.."
}
